name: Deploy

# Continuous deployment to the dalang VM (tailnet node "dalang").
#
# Runs after the CI workflow (ci.yml: clippy, cargo test, Playwright) succeeds
# on main, so nothing untested ships. The release binary is built here on
# ubuntu-24.04 to match the VM's glibc (2.39). The runner joins the tailnet
# as tag:ci and reaches the VM over Tailscale SSH, so no SSH key is stored in
# GitHub.
#
# Public URL: https://文.ngublag.com (xn--7dv.ngublag.com) via the cloudflared
# tunnel on dalang. See deploy/ for the server-side scripts.
#
# Rollback: run this workflow manually with `rollback_to` = a release SHA
# that is still in /opt/bunamateur/releases on the server.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_to:
        description: "Release SHA to re-activate (blank = build & deploy the selected ref)"
        required: false
        type: string

concurrency:
  group: deploy-bunamateur-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  deploy:
    name: Build & deploy to dalang
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    environment:
      name: production
      url: https://xn--7dv.ngublag.com
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Resolve what to deploy
        id: target
        run: |
          if [ -n "${{ inputs.rollback_to }}" ]; then
            echo "sha=${{ inputs.rollback_to }}" >> "$GITHUB_OUTPUT"
            echo "rollback=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Rolling back to ${{ inputs.rollback_to }}"
          else
            sha="${{ github.event.workflow_run.head_sha || github.sha }}"
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            echo "rollback=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploying $sha"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.rollback == 'true' && github.sha || steps.target.outputs.sha }}

      - uses: oven-sh/setup-bun@v2
        if: steps.target.outputs.rollback == 'false'
        with:
          bun-version: '1.2'

      - name: Build frontend
        if: steps.target.outputs.rollback == 'false'
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run build

      - uses: dtolnay/rust-toolchain@stable
        if: steps.target.outputs.rollback == 'false'

      - uses: Swatinem/rust-cache@v2
        if: steps.target.outputs.rollback == 'false'
        with:
          shared-key: deploy-release

      - name: Build release binary
        if: steps.target.outputs.rollback == 'false'
        run: |
          cargo build --release --locked
          file target/release/bunamateur | grep -q 'ELF 64-bit LSB.*x86-64'

      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy
        env:
          HOST: ardfard@dalang.tail2a8683.ts.net
        run: |
          set -euo pipefail
          if [ "${{ steps.target.outputs.rollback }}" = "true" ]; then
            ./deploy/deploy.sh --rollback "${{ steps.target.outputs.sha }}" "$HOST"
          else
            ./deploy/deploy.sh target/release/bunamateur "${{ steps.target.outputs.sha }}" "$HOST"
          fi

      - name: Public smoke test
        run: |
          for i in $(seq 1 10); do
            if curl -fsS -o /dev/null https://xn--7dv.ngublag.com/; then
              echo "public URL OK"; exit 0
            fi
            sleep 5
          done
          echo "::error::https://xn--7dv.ngublag.com/ not reachable"; exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy ${{ job.status }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Release | \`${{ steps.target.outputs.sha }}\` |"
            echo "| Mode | ${{ steps.target.outputs.rollback == 'true' && 'rollback (symlink flip)' || 'build + deploy' }} |"
            echo "| URL | https://文.ngublag.com |"
          } >> "$GITHUB_STEP_SUMMARY"
