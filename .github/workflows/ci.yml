name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run frontend tests
        run: bun test --pass-with-no-tests

      - name: Build frontend bundle
        run: bun run build

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

  rust-check-and-test:
    name: Rust Clippy & Tests
    needs: frontend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bunamateur
          POSTGRES_PASSWORD: bunamateur_test_password
          POSTGRES_DB: bunamateur_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CARGO_TERM_COLOR: always
      DATABASE_URL: postgres://bunamateur:bunamateur_test_password@127.0.0.1:5432/bunamateur_test
      TEST_DATABASE_URL: postgres://bunamateur:bunamateur_test_password@127.0.0.1:5432/bunamateur_test
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download frontend dist artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup Kache compiler cache
        uses: kunobi-ninja/kache-action@v1
        with:
          pr-comment: false

      - name: Run cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run cargo test
        run: cargo test

  e2e:
    name: End-to-End (Playwright)
    needs: [frontend, rust-check-and-test]
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bunamateur
          POSTGRES_PASSWORD: bunamateur_test_password
          POSTGRES_DB: bunamateur_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CARGO_TERM_COLOR: always
      HOST: 127.0.0.1
      PORT: '8080'
      LOG_FORMAT: json
      DATABASE_URL: postgres://bunamateur:bunamateur_test_password@127.0.0.1:5432/bunamateur_test
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      COOKIE_SECURE: 'false'
      EMAIL_PROVIDER: log
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download frontend dist artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Kache compiler cache
        uses: kunobi-ninja/kache-action@v1
        with:
          pr-comment: false

      - name: Build server binary
        run: cargo build --locked

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4'

      - name: Install Playwright browsers
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium

      - name: Start server and run Playwright E2E suite
        run: |
          ./target/debug/bunamateur &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 || curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          if [ -f frontend/playwright.config.ts ] || [ -f frontend/playwright.config.js ]; then
            (cd frontend && bunx playwright test)
          else
            echo "No Playwright config found yet; verifying server smoke endpoint"
            curl -fsS http://127.0.0.1:8080/ >/dev/null
          fi

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
